worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    server {
        listen 80;
        server_name _;
        root /var/www/excalidraw-static;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:3033;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            client_max_body_size 50m;
        }

        location /embed {
            proxy_pass http://127.0.0.1:3033;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location = /build-meta.json {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location ^~ /icons/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ^~ /assets/ {
            try_files $uri =404;
            gzip on;
            gzip_types application/javascript text/css application/json;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Bridge shell is not content-hashed. Revalidate it to avoid iframe/host version skew.
        location ^~ /mind-map/dist/bridge/ {
            try_files $uri =404;
            gzip on;
            gzip_static on;
            gzip_types application/javascript;
            add_header Cache-Control "public, no-cache, must-revalidate";
        }

        # MindMap iframe: never SPA-fallback missing .js to index.html (causes MIME text/html errors)
        location ^~ /mind-map/dist/ {
            try_files $uri =404;
            gzip on;
            gzip_static on;
            gzip_types application/javascript text/css application/json;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Large lazy chunks (~3MB): helps broken HTTP/2 proxies upstream of this nginx
            sendfile_max_chunk 512k;
        }

        location ^~ /mind-map/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
