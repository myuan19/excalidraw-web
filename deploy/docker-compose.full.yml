# 全栈部署：nginx 静态页 + /api → server（SQLite + 文件）
# 用法:
#   docker compose -f deploy/docker-compose.full.yml up -d --build
#   docker compose -f deploy/docker-compose.full.yml logs -f
#
# 数据在命名卷 editorhub_web_data → 容器内 /var/lib/excalidraw
# 日志: docker logs（stdout/stderr）

services:
  editorhub-full:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.full
    image: editorhub-web:full
    container_name: editorhub-full
    ports:
      - "${EDITORHUB_PORT:-8080}:80"
    volumes:
      - editorhub_web_data:/var/lib/excalidraw
    restart: unless-stopped
    environment:
      NODE_ENV: production

volumes:
  editorhub_web_data:
    name: editorhub_web_data
