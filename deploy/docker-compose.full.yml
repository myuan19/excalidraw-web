# 全栈部署：nginx 静态页 + /api → server（SQLite + 文件）
# 用法:
#   docker compose -f deploy/docker-compose.full.yml up -d --build
#   docker compose -f deploy/docker-compose.full.yml logs -f
#
# 数据在命名卷 excalidraw_web_data → 容器内 /var/lib/excalidraw
# 日志: docker logs（stdout/stderr）

services:
  excalidraw-full:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.full
    image: excalidraw-web:full
    container_name: excalidraw-full
    ports:
      - "${EXCALIDRAW_PORT:-8080}:80"
    volumes:
      - excalidraw_web_data:/var/lib/excalidraw
    restart: unless-stopped
    environment:
      NODE_ENV: production

volumes:
  excalidraw_web_data:
    name: excalidraw_web_data
