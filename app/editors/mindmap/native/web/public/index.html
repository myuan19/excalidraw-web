<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0"
    />
    <link rel="icon" href="dist/logo.ico" />
    <title></title>
    <script>
      // 自定义静态资源的路径
      window.externalPublicPath = './dist/'
      // 在 iframe 内时由宿主通过 postMessage 接管初始化；
      // 单独打开（开发调试）时直接初始化，无需等待宿主消息。
      window.takeOverApp = window.parent !== window
    </script>
    <!-- 51.la 统计：外网/防火墙下常失败；需要时在本地动态加载，见官方文档，勿阻塞应用 -->
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- Host takeover bridge (source: native/web/src/bridge/takeoverShell.js) -->
    <script src="dist/bridge/takeover-shell.js"></script>
    <!-- built files will be auto injected -->
  </body>
</html>
