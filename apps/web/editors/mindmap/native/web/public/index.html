<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    window.takeOverApp = window.parent !== window;
    window.__nbApplyHostViewport = function () {
      window.parent.postMessage({
        source: "simple-mind-map-native",
        type: "embed_preview_viewport_applied",
        ok: true
      }, "*");
    };
    window.addEventListener("message", function (event) {
      var message = event.data || {};
      if (message.type === "host_restore_preview_view") {
        try {
          window.__nbApplyHostViewport(message.view);
        } catch (error) {
          window.parent.postMessage({
            source: "simple-mind-map-native",
            type: "mindMapIframeError",
            ok: false,
            message: String(error && error.message || error)
          }, "*");
        }
      }
    });
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
