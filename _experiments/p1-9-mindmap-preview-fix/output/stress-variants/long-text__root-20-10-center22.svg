<text x="116.8" y="20.9" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#1e3556" font-weight="400">不要把所有超长内容全部塞进卡片里</text>

</g>
<g class="smm-node" transform="matrix(1,0,0,1,1560,772)">
