<g class="smm-node-container"><g class="smm-node" transform="matrix(1,0,0,1,260,520)">
<rect width="154" height="45" rx="10" ry="10" class="smm-node-shape" fill="#1e3556" stroke="#1e3556" stroke-width="2"></rect>
<text x="77" y="30.9" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#fff" font-weight="700">中心主题</text>

</g>
<g class="smm-node" transform="matrix(1,0,0,1,560,260)">
<rect width="240" height="38" rx="5" ry="5" class="smm-node-shape" fill="#a9dada" stroke="#1e3556" stroke-width="2"></rect>
<text x="120" y="25.3" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#fff" font-weight="400">这是一条非常长的分支标题用于测试文本宽度</text>

</g>
<g class="smm-node" transform="matrix(1,0,0,1,810,388)">
<rect width="240" height="32" rx="5" ry="5" class="smm-node-shape" fill="transparent" stroke="#1e3556" stroke-width="1"></rect>
<text x="120" y="20.9" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#1e3556" font-weight="400">较长节点内容会让画布横向跨度明显增加</text>

</g>
<g class="smm-node" transform="matrix(1,0,0,1,1060,516)">
<rect width="221" height="32" rx="5" ry="5" class="smm-node-shape" fill="transparent" stroke="#1e3556" stroke-width="1"></rect>
<text x="110.5" y="20.9" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#1e3556" font-weight="400">需要确认预览仍聚焦中心主题附近</text>

</g>
<g class="smm-node" transform="matrix(1,0,0,1,1310,644)">
